[project]
name = "metis"
version = "0.1.0"
description = "Metis-Auto v2: UniRoute-style LLM router and gateway (Rahnema College 2026)"
authors = [{ name = "Mehrdad Rahmani", email = "mehrdad.rahmani100@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "litellm>=1.106.6",
    "mlflow>=3.16",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "psutil>=7.2.2",
    "pyarrow>=25,<26",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "tenacity>=9.2.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "umap-learn>=0.5.12",
]

[tool.uv]
python-preference = "only-managed"   # never use Anaconda/system Python (owner choice, WP-00)
