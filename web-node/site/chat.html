<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat · TakRouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/assets/site.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/web/assets/site.js"></script>
<style>
html,body{height:100%}
html{overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.site-head{flex:none}
.app{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.newchat{margin:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-weight:600}
.newchat:hover{border-color:var(--violet);color:var(--violet-ink)}
.list{flex:1;overflow:auto;padding:0 10px}
.list h6{margin:6px 8px;font-size:12px;color:var(--muted);font-weight:600}
.conv{display:flex;align-items:center;gap:4px;width:100%;padding:8px 10px;border-radius:10px;color:var(--ink2);font-size:14px;cursor:pointer}
.conv span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.conv:hover{background:var(--chip)}
.conv.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.conv button{opacity:0;border:0;background:none;color:var(--muted);padding:0 3px;font-size:13px}
.conv:hover button{opacity:1}
.sidefoot{padding:12px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.save{border-radius:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line)}
.save small{display:block;color:var(--muted);font-size:12px}
.save strong{font-size:22px;font-weight:800;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.save .sub{font-size:12px;color:var(--ink2)}
.credit{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modes{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px;position:relative}
.modes button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;position:relative;z-index:1;transition:color .25s}
.modes button.on{color:var(--ink)}
.modes .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);transition:transform .32s cubic-bezier(.3,1.3,.5,1),width .32s cubic-bezier(.3,1.3,.5,1)}
.modes:not(.ready) .pill{transition:none}
.owntag{font-size:12px;font-weight:600;color:var(--ok);background:var(--okbg);padding:3px 9px;border-radius:99px;white-space:nowrap}
.answer[data-typing] .caret{display:inline-block;width:.5em;height:1.05em;margin-inline-start:2px;vertical-align:-.15em;border-radius:2px;background:linear-gradient(180deg,#3d6bff,#c13cff);animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);padding:5px 10px;border-radius:99px;background:var(--chip);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:#1fbf75;box-shadow:0 0 0 3px rgba(31,191,117,.2)}.dot.demo{background:#f0a020}
.adv{position:relative}
.pop{position:absolute;top:42px;inset-inline-start:0;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;z-index:20;display:none}
.pop.open{display:block}
.pop h4{margin:0 0 4px;font-size:14px}
.pop p{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
.pop label.l{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.range{width:100%;accent-color:var(--violet)}
.rangeends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.scroll{flex:1;overflow:auto}
.thread{max-width:800px;margin:0 auto;padding:26px 20px 12px}
.empty{max-width:720px;margin:7vh auto 0;padding:0 20px;text-align:center}
.empty .mark{width:56px;height:56px;border-radius:18px;margin:0 auto 18px}
.empty .mark svg{width:30px;height:30px}
.empty h1{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-.4px}
.empty p{margin:0 auto 26px;color:var(--ink2);max-width:520px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.sug:hover{border-color:var(--violet)}
.sug b{font-size:14px;font-weight:600}.sug span{font-size:12.5px;color:var(--muted)}

.msg{display:flex;margin:0 0 22px}
.bubble{background:var(--userq);padding:10px 18px;border-radius:22px;max-width:75%;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{gap:12px;align-items:flex-start}
.avatar{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;margin-top:2px}
.body{flex:1;min-width:0}
.answer{word-wrap:break-word}
.answer p{margin:0 0 10px}
.answer :is(ul,ol){margin:0 0 10px;padding-inline-start:22px}
.answer h1,.answer h2,.answer h3{font-size:16px;margin:14px 0 6px}
.answer pre{background:#16132a;color:#ecebf5;padding:12px 14px;border-radius:12px;overflow:auto;direction:ltr;text-align:left;font-size:13px}
.answer pre code{background:none;padding:0;color:inherit}
.answer table{border-collapse:collapse;margin:0 0 10px;font-size:14px}
.answer th,.answer td{border:1px solid var(--line2);padding:4px 10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--ink2);border:0}
.chip.good{background:var(--okbg);color:var(--ok);font-weight:600}.chip.warn{background:var(--warnbg);color:var(--warn)}
button.chip:hover{color:var(--violet-ink)}
.acts{display:flex;gap:2px;margin-top:6px}
.acts button{border:0;background:none;color:var(--muted);font-size:12.5px;padding:3px 7px;border-radius:7px}
.acts button:hover{background:var(--chip);color:var(--violet-ink)}
.panel{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);font-size:13px}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle}
.panel tr.pick td{font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px}
.note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.tl li:first-child{border-top:0}
.tl .n{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--violet-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.tl b{display:block;font-size:13px}
.tl span.d{color:var(--ink2);font-size:12.5px}
.tl .ms{color:var(--muted);font-size:12px;white-space:nowrap}
.errbox{background:var(--errbg);color:var(--err);padding:10px 14px;border-radius:12px;font-size:14px}
.typing{display:inline-flex;gap:4px;padding:10px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px);background:#9933ff}}
@media (prefers-reduced-motion:reduce){.typing i,.answer[data-typing] .caret{animation:none}.modes .pill{transition:none}}

.composer{padding:10px 20px 16px}
:root{--userq:#f2f1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--userq:#2a2838}}
:root[data-theme="dark"]{--userq:#2a2838}
.sys{max-width:800px;margin:0 auto 8px}
.sys textarea{width:100%;border:1px dashed var(--line2);border-radius:12px;background:var(--bg2);padding:8px 12px;font-size:13px;resize:vertical;min-height:44px}
.box{max-width:800px;margin:0 auto;border:1px solid var(--line2);border-radius:26px;background:var(--panel);box-shadow:0 1px 6px rgba(20,16,40,.06);padding:10px 10px 10px 12px;display:flex;align-items:flex-end;gap:8px;transition:box-shadow .2s,border-color .2s}
.box:focus-within{border-color:color-mix(in srgb,var(--ink) 18%,var(--line2));box-shadow:0 4px 22px rgba(20,16,40,.10)}
.box textarea:focus,.box textarea:focus-visible{outline:0}
.box textarea{flex:1;border:0;outline:0;resize:none;background:none;max-height:200px;min-height:26px;padding:4px 6px;line-height:1.7}
.send{width:38px;height:38px;border-radius:12px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
html[dir="rtl"] .send.go svg{transform:scaleX(-1)}
.hint{max-width:800px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
/* ---- friendlier chat (ideas from ChatGPT / Claude) ---- */
.main{position:relative}
.sidebtn{display:none}
/* ---- Claude-like shell: no site header on this page; the sidebar carries logo, account, language, theme ---- */
.app{transition:grid-template-columns .28s cubic-bezier(.4,0,.2,1)}
.side{overflow:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 0 14px}
.side-logo{font-size:16px;white-space:nowrap}
.side-logo .mark{width:28px;height:28px;border-radius:9px}.side-logo .mark svg{width:16px;height:16px}
.side .newchat{margin:12px 14px}
.side-bottom{display:flex;align-items:center;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.side-bottom .acct{flex:1;min-width:0}
.side-bottom .acct-btn{width:100%;border-radius:12px;justify-content:flex-start;height:40px;border-color:transparent;background:none}
.side-bottom .acct-btn:hover{background:var(--chip)}
.side-bottom .acct-btn .nm{max-width:none!important}
.side .menu{top:auto;bottom:48px;inset-inline-start:0;inset-inline-end:auto;min-width:230px}
.side .menu .sitelinks{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.side .menu .sitelinks a{font-size:13.5px;color:var(--ink2)}
.side .menu #logoutbtn{border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 9px 9px}
.side-bottom .langbtn{height:34px;padding:0 9px}
.side-bottom .iconbtn{width:34px;height:34px}
.railbtn{display:none;margin:0 auto 8px}
@media (min-width:861px){
/* collapsed = a thin rail of icons */
.app.collapsed{grid-template-columns:60px 1fr}
.app.collapsed .side-top{justify-content:center;padding:12px 0 0}
.app.collapsed .side-logo,.app.collapsed .search,.app.collapsed .list,.app.collapsed .sidefoot,
.app.collapsed .side-bottom .langbtn,.app.collapsed .side-bottom #themebtn,.app.collapsed .newchat span,.app.collapsed .acct-btn .nm{display:none}
.app.collapsed .newchat{width:40px;height:40px;padding:0;margin:12px auto 8px}
.app.collapsed .railbtn{display:grid}
.app.collapsed .list-spacer{display:block;flex:1}
.list-spacer{display:none}
.app.collapsed .side-bottom{justify-content:center;border-top:0;padding:10px 0 14px}
.app.collapsed .side-bottom .acct{flex:none}
.app.collapsed .acct-btn{width:auto;padding:3px}
}
.top{border-bottom:0}
/* ---- motion: everything reacts, nothing jumps ---- */
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.msg.enter{animation:msgIn .32s cubic-bezier(.2,.8,.2,1) both}
.thread.swap{animation:fadeIn .22s ease-out}
.empty,.main.fresh #sugbox{animation:msgIn .4s cubic-bezier(.2,.8,.2,1) both}
.main.fresh #sugbox{animation-delay:.08s}
.pop{display:block;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .16s,transform .16s,visibility .16s}
.pop.open{opacity:1;visibility:visible;transform:none}
.side .menu{display:block;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .16s,transform .16s,visibility .16s}
.side .menu.open{opacity:1;visibility:visible;transform:none}
.main button,.side button,.sug{transition:transform .12s,background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.main button:active:not(:disabled),.side button:active{transform:scale(.95)}
.sug:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.conv{transition:background-color .15s,color .15s}
.send:not(:disabled):hover{transform:scale(1.06)}
.shimmer{background:linear-gradient(90deg,var(--muted) 35%,var(--ink) 50%,var(--muted) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
.dot.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,191,117,0)}}
.backdrop{position:fixed;inset:0;background:rgba(10,8,25,.35);z-index:39;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.backdrop.show{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){
  .app,.msg.enter,.thread.swap,.empty,#sugbox,.pop,.side .menu,.side,.shimmer,.dot.live{animation:none!important;transition:none!important}
}
.search{margin:0 14px 10px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:13.5px;outline:0}
html[dir="rtl"] .search input{padding:8px 32px 8px 12px}
.search input:focus{border-color:var(--line2)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:10px;color:var(--muted)}
.conv span{unicode-bidi:plaintext;text-align:start}
.list .none{padding:8px;color:var(--muted);font-size:13px}
.conv input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:7px;padding:2px 6px;font:inherit;background:var(--bg);outline:0}
.undo{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 10px 9px 16px;border-radius:12px;font-size:14px;z-index:100;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.undo button{border:0;background:var(--panel);color:var(--ink);font-weight:700;border-radius:8px;padding:5px 10px;font-size:13px}
/* the new-chat screen: greeting and input in the middle */
.main.fresh{justify-content:center;padding-bottom:10vh}
.main.fresh .scroll{flex:none;overflow:visible}
.main.fresh .empty{margin-top:0}
.main.fresh .hint{display:none}
.main.fresh .top{position:absolute;top:0;inset-inline:0}
#sugbox{max-width:800px;margin:12px auto 0;display:none}
.main.fresh #sugbox{display:grid}
/* messages */
.msg.user{flex-direction:column;align-items:flex-start}
.msg .acts{opacity:0;transition:opacity .15s}
.msg:hover .acts,.msg.last .acts,.msg:focus-within .acts{opacity:1}
@media (hover:none){.msg .acts{opacity:1}}
.acts button{display:inline-flex;align-items:center;gap:5px}
.acts svg{width:15px;height:15px}
.acts button.done{color:var(--ok)}
.editbox{width:min(100%,640px);background:var(--userq);border-radius:22px;padding:10px 12px}
.editbox textarea{width:100%;border:0;background:none;resize:none;outline:0;font:inherit;line-height:1.7;min-height:52px}
.editbox .row{display:flex;gap:8px;justify-content:flex-end}
.answer pre{position:relative;padding-top:38px}
.codehead{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 14px;font-size:12px;color:#a9a5c4;border-bottom:1px solid #2a2645;direction:ltr;font-family:var(--sans,"Vazirmatn","Inter",system-ui,sans-serif)}
.codehead button span{font-family:"Vazirmatn","Inter",system-ui,sans-serif}
.stopnote{color:var(--muted);font-size:13.5px;font-style:italic;padding:4px 0}
.codehead button{border:0;background:none;color:#cfcbe6;font-size:12px;display:inline-flex;gap:5px;align-items:center;padding:2px 6px;border-radius:6px}
.codehead button:hover{background:#2a2645}
.tobottom{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow);display:none;place-items:center;color:var(--ink2);z-index:5}
.tobottom.show{display:grid}
.tobottom:hover{color:var(--ink)}
.pop .switch{margin-top:12px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:290px;z-index:40;display:flex;box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  html[dir="rtl"] .side{transform:translateX(105%)}
  .side.open,html[dir="rtl"] .side.open{transform:none}
  .app.collapsed{grid-template-columns:1fr}
  .sidebtn{display:grid}
  .sugs,#sugbox{grid-template-columns:1fr}
  .main.fresh #sugbox .sug:nth-child(n+3){display:none}
  .main.fresh{justify-content:flex-start;padding-bottom:0}
  .main.fresh .top{position:static}
  .main.fresh .empty{margin-top:5vh}
  .status .txt{display:none}
  .status{padding:8px}
}
@media (max-width:600px){
  .top .status{display:none}  /* one row on phones */
  .modes button{padding:6px 11px}
  .thread,.composer{padding-inline:14px}
  .pop{width:min(330px,calc(100vw - 28px))}
}
</style>
</head>
<body data-bare="1">
<div class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="logo side-logo" href="/"><span class="mark" id="sidemark"></span>TakRouter</a>
      <button class="iconbtn" id="sidetoggle" type="button" data-i18n-title="hideSide"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <button class="newchat" id="newchat" data-i18n-title="newChatKey"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newChat"></span></button>
    <button class="iconbtn railbtn" id="searchbtn" type="button" data-i18n-title="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" data-i18n-placeholder="search" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <div class="sidefoot">
      <div class="save"><small data-i18n="savedTitle"></small><strong id="saved">—</strong><div class="sub" id="savedsub"></div></div>
      <div class="credit"><span data-i18n="credit"></span><b id="credit">—</b></div>
    </div>
    <div class="list-spacer"></div>
    <div class="side-bottom">
      <div class="acct" id="acct"></div>
      <button class="langbtn" id="langbtn" type="button" aria-label="Language / زبان"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="lt" id="langtxt"></span></button>
      <button class="iconbtn" id="themebtn" type="button" data-i18n-title="theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

// Streaming: read the server-sent events and draw the answer as it is written. A `reset` event (a backup
// model or a repair) clears what is shown. The last event carries the full result (model, cost, trace).
async function streamChat(body, headers, signal, box, live) {
  const r = await fetch("/v1/chat/completions", {method: "POST", credentials: "same-origin", signal,
    headers: {"Content-Type": "application/json", Accept: "text/event-stream", ...headers}, body: JSON.stringify(body)});
  const fail = (status, data) => { const e = new Error(data?.error?.message || data?.detail || String(status)); e.status = status; e.data = data; return e; };
  if (!r.ok) throw fail(r.status, await r.json().catch(() => ({})));
  if (!(r.headers.get("content-type") || "").includes("event-stream")) return r.json();  // a server without streaming
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", final = null, ans = null, queued = false;
  const draw = () => {
    queued = false; if (!ans) return;
    ans.innerHTML = md(live.text);
    delete ans.dataset.typing; window.TRbidi?.(ans); ans.dataset.typing = "1";  // prices/English in order, every frame
    ans.append(el("span", "caret"));
    const sc = $("scroll"); if (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 200) sc.scrollTop = sc.scrollHeight;
  };
  const later = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, cut).trim(); buf = buf.slice(cut + 2);
      if (!line.startsWith("data: ")) continue;
      const raw = line.slice(6); if (raw === "[DONE]") continue;
      const ev = JSON.parse(raw);
      if (ev.error) throw fail(ev.error.status || 500, {error: ev.error});
      if (ev.takrouter?.event === "reset") { live.text = ""; later(); continue; }
      const piece = ev.choices?.[0]?.delta?.content;
      if (piece) {
        if (!ans) { box.innerHTML = ""; ans = el("div", "answer"); ans.dataset.typing = "1"; box.append(ans); }
        live.text += piece; live.pieces++; later();
      }
      if (ev.choices?.[0]?.finish_reason === "stop") final = ev;
    }
  }
  if (!final) throw fail(0, {});
  return {model: final.model, usage: final.usage, takrouter: final.takrouter, choices: [{message: {content: live.text}}]};
}

  try { health = await TR.api("/health"); } catch { health = null; }
  try {
    router = await TR.api("/v1/router");
    const s = new Set([0, router.default_lambda, 3, ...router.breakpoints.filter((b) => b < 20)]);
    for (const b of router.breakpoints) if (b < 20) s.add(+(b * 1.02).toFixed(4));
    stops = [...s].map((x) => +(+x).toFixed(4)).sort((a, b) => a - b); $("lam").max = stops.length - 1;
  } catch {}
  setMode(TR.store.get("mode", "bal")); fillForce(); renderAll(); renderStatus(); updateSend(); refreshCredit();
  const pre = new URLSearchParams(location.search).get("q");
  if (pre) { $("input").value = pre; autosize(); updateSend(); }
  if (matchMedia("(hover:hover)").matches) $("input").focus();
})();
</script>
</body>
</html>
