<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khayyam chat · TakRouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/assets/site.css">
<script src="/web/assets/site.js"></script>
<style>
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin-top:18px;align-items:start}
.form{display:grid;gap:10px}
.form label{font-size:13px;font-weight:600;color:var(--ink2)}
.optin{display:flex;gap:8px;align-items:center}
.optin .n{width:26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
textarea.input{min-height:120px;resize:vertical;direction:rtl;text-align:right}
.optin .input{direction:rtl;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.turn{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);margin-bottom:12px}
.turn .q{white-space:pre-wrap;direction:rtl;text-align:right;font-size:14.5px}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:11px;font-size:14px;direction:rtl;text-align:right}
.opt .n{width:22px;height:22px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.opt.pick{border-color:var(--violet);background:var(--soft)}
.opt.pick .n{background:var(--violet);color:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.raw{margin-top:8px;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.tl{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:var(--ink2)}
.tl li{padding:5px 0;border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:22px 4px;text-align:center}
@media (max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head"><div class="kicker" data-i18n="kick"></div><h1 data-i18n="title"></h1><p data-i18n="lead"></p>
    <div class="row" style="margin-top:10px"><span class="tag" id="mode"></span></div></div>

  <div class="grid">
    <div class="card">
      <form class="form" id="f">
        <label for="q" data-i18n="q_label"></label>
        <textarea class="input" id="q" data-i18n-placeholder="q_ph" required maxlength="4000"></textarea>
        <label data-i18n="o_label"></label>
        <div class="optin"><span class="n">۱</span><input class="input" id="o1" required maxlength="1000"></div>
        <div class="optin"><span class="n">۲</span><input class="input" id="o2" required maxlength="1000"></div>
        <div class="optin"><span class="n">۳</span><input class="input" id="o3" required maxlength="1000"></div>
        <div class="optin"><span class="n">۴</span><input class="input" id="o4" required maxlength="1000"></div>
        <label data-i18n="lam_label"></label>
        <div class="seg" id="modes"><button type="button" data-m="best" data-i18n="m_best"></button><button type="button" data-m="chosen" class="on" data-i18n="m_chosen"></button><button type="button" data-m="cheap" data-i18n="m_cheap"></button></div>
        <div class="row" style="margin-top:4px">
          <button class="btn primary" id="ask" type="submit" data-i18n="ask"></button>
          <button class="btn small" id="example" type="button" data-i18n="example"></button>
          <label class="switch"><input type="checkbox" id="tracebox"><span data-i18n="trace"></span></label>
        </div>
        <div id="err"></div>
        <p class="muted" style="font-size:12.5px;margin:0" data-i18n="cost_note"></p>
      </form>
    </div>
    <div>
      <div id="log"><div class="empty" data-i18n="empty"></div></div>
    </div>
  </div>
</main>
<script>
TR.dict({
  fa: { kick: "دموی آزمون خیام", title: "گفتگو با خیام", lead: "سؤال چهارگزینه‌ای خودتان را بنویسید. مسیریاب خیام موضوع سؤال را تشخیص می‌دهد، مناسب‌ترین مدل را انتخاب می‌کند و مدل همان لحظه جواب می‌دهد.",
        q_label: "متن سؤال", q_ph: "مثلاً: کدام عنصر بیشترین الکترونگاتیوی را دارد؟", o_label: "گزینه‌ها", lam_label: "اولویت",
        m_best: "بهترین دقت", m_chosen: "متعادل", m_cheap: "کمترین هزینه", ask: "بپرس", example: "یک سؤال نمونه", trace: "نمایش مسیر",
        cost_note: "هر پرسش یک فراخوانی واقعی است (کسری از سنت) و از اعتبار حساب شما کم می‌شود. سؤال‌هایی که اینجا می‌نویسید در هیچ ارزیابی‌ای استفاده نمی‌شوند.",
        empty: "هنوز سؤالی نپرسیده‌اید.", live: "پاسخ واقعی مدل‌ها", mock: "حالت نمایشی: پاسخ‌ها ساختگی‌اند (سایت بدون TAKROUTER_PROVIDER=live اجرا شده)",
        picked: (m) => `TakRouter این سؤال را به ${m} داد`, answer: (n) => `پاسخ: گزینه‌ی ${n}`, noans: "پاسخ قابل‌تشخیص نبود",
        subject: (s) => `موضوع: ${s}`, tr_scores: "امتیاز هر مدل (کمتر بهتر)", tr_calls: "فراخوانی‌ها", tr_checks: "بررسی پاسخ",
        need4: "متن سؤال و هر چهار گزینه را بنویسید.", login: "برای پرسیدن ابتدا وارد شوید.", login_btn: "ورود" },
  en: { kick: "Khayyam exam demo", title: "Khayyam chat", lead: "Type your own four-option question. The Khayyam router detects the subject, picks the best-suited model, and that model answers right away.",
        q_label: "Question", q_ph: "e.g. Which element has the highest electronegativity?", o_label: "Options", lam_label: "Priority",
        m_best: "Best accuracy", m_chosen: "Balanced", m_cheap: "Lowest cost", ask: "Ask", example: "Example question", trace: "Show trace",
        cost_note: "Each question is one real model call (a fraction of a cent) and comes off your account credit. Questions typed here are never used in any evaluation.",
        empty: "No questions yet.", live: "Real model answers", mock: "Demo mode: answers are fake (the site was started without TAKROUTER_PROVIDER=live)",
        picked: (m) => `TakRouter sent this question to ${m}`, answer: (n) => `Answer: option ${n}`, noans: "No option could be read",
        subject: (s) => `Subject: ${s}`, tr_scores: "Each model's score (lower is better)", tr_calls: "Calls", tr_checks: "Answer checks",
        need4: "Write the question and all four options.", login: "Sign in first to ask.", login_btn: "Sign in" },
});
const $ = (id) => document.getElementById(id);
TR.subnav([["/khayyam", "kh_over"], ["/khayyam/chat", "kh_chat"], ["/khayyam#subjects", "kh_subj"]]);
const name = (m) => m === "deepseek-v4-pro" ? "DeepSeek V4 Pro" : TR.model(m).name;
let info = null, mode = "chosen", turns = [], live = null;
const lamFor = () => mode === "best" ? 0 : mode === "cheap" ? 100 : null;
const subjOf = (k) => { const c = info?.clusters?.find((x) => x.cluster === k); return c ? (TR.lang === "fa" ? c.name_fa : c.name_en) : String(k); };

function err(msg, login) {
  $("err").innerHTML = "";
  if (!msg) return;
  const d = document.createElement("div"); d.className = "notice err"; d.textContent = msg;
  if (login) { const a = document.createElement("a"); a.href = "/login?next=/khayyam/chat"; a.textContent = " " + TR.t("login_btn"); d.append(a); }
  $("err").append(d);
}
function badge() {
  if (live == null) { $("mode").style.display = "none"; return; }
  $("mode").style.display = ""; $("mode").className = "tag " + (live ? "ok" : "warn"); $("mode").textContent = live ? TR.t("live") : TR.t("mock");
}
function render() {
  const log = $("log"); log.innerHTML = "";
  if (!turns.length) { log.innerHTML = `<div class="empty"></div>`; log.firstChild.textContent = TR.t("empty"); return; }
  for (const t of [...turns].reverse()) {
    const d = document.createElement("div"); d.className = "turn";
    const q = document.createElement("div"); q.className = "q"; q.textContent = t.q; d.append(q);
    const opts = document.createElement("div"); opts.className = "opts";
    t.choices.forEach((c, i) => {
      const o = document.createElement("div"); o.className = "opt" + (String(i + 1) === t.r.answer ? " pick" : "");
      o.innerHTML = `<span class="n"></span><span></span>`; o.children[0].textContent = TR.num(i + 1); o.children[1].textContent = c; opts.append(o);
    });
    d.append(opts);
    const v = document.createElement("div"); v.className = "verdict";
    const p = document.createElement("b"); p.textContent = TR.t("picked", name(t.r.model || "?")); v.append(p);
    const a = document.createElement("span"); a.className = "tag " + (t.r.answer ? "brand" : "warn"); a.textContent = t.r.answer ? TR.t("answer", TR.num(+t.r.answer)) : TR.t("noans"); v.append(a);
    const tr = t.r.trace || {};
    if (tr.cluster != null) { const s = document.createElement("span"); s.className = "tag"; s.textContent = TR.t("subject", subjOf(tr.cluster)); v.append(s); }
    if (tr.cost_usd != null) { const s = document.createElement("span"); s.className = "tag"; s.textContent = TR.usd(tr.cost_usd); v.append(s); }
    d.append(v);
    if (!t.r.answer && t.r.text) { const raw = document.createElement("div"); raw.className = "raw"; raw.textContent = t.r.text; d.append(raw); }
    if ($("tracebox").checked) {
      const ul = document.createElement("ul"); ul.className = "tl";
      const sc = Object.entries(tr.scores || {}).sort((x, y) => x[1] - y[1]).map(([m, s]) => `${name(m)} ${TR.num(s, 3)}`).join(" · ");
      const calls = (tr.attempts || []).map((x) => `${name(x.model)}: ${x.status || x.reason || "ok"}`).join(" → ");
      for (const s of ["λ = " + TR.num(tr.lam ?? 0, 3), TR.t("tr_scores") + ": " + sc, TR.t("tr_calls") + ": " + (calls || name(tr.served_by || t.r.model)), TR.t("tr_checks") + ": " + ((tr.reasons || []).join(", ") || "✓")]) {
        const li = document.createElement("li"); li.textContent = s; ul.append(li);
      }
      d.append(ul);
    }
    log.append(d);
  }
}
async function ask(e) {
  e.preventDefault(); err("");
  const q = $("q").value.trim(), choices = ["o1", "o2", "o3", "o4"].map((k) => $(k).value.trim());
  if (!q || choices.some((c) => !c)) { err(TR.t("need4")); return; }
  const btn = $("ask"); btn.disabled = true;
  try {
    const r = await TR.api("/v1/khayyam/ask", {method: "POST", body: {question: q, choices, lam: lamFor()}});
    live = r.live; badge();
    turns.push({q, choices, r}); render();
  } catch (x) {
    err(x.status === 401 ? TR.t("login") : x.message, x.status === 401);
  } finally { btn.disabled = false; }
}
async function example() {
  err("");
  try {
    const s = await TR.api("/v1/khayyam/sample?seed=" + Math.floor(Math.random() * 1e9));
    $("q").value = s.question; s.choices.forEach((c, i) => { $("o" + (i + 1)).value = c; });
  } catch (x) { err(x.message); }
}
for (const b of $("modes").children) b.onclick = () => { mode = b.dataset.m; for (const x of $("modes").children) x.classList.toggle("on", x === b); };
$("f").onsubmit = ask;
$("example").onclick = example;
$("tracebox").onchange = render;
TR.onLang(() => { badge(); render(); });
badge();
TR.api("/v1/khayyam/info").then((x) => { info = x; render(); }).catch(() => {});
</script>
</body>
</html>
