    provider: openai
    api_path: "/openai/v1"
    api_name: gpt-5.6-terra   # D-083; compared with jev in the pilot
    price_in: 2.20
    price_out: 13.20
    context_window: null
    vision: false
    is_anchor: false
    role: judge
    verified: false
  - id: deepseek-v4-pro
    provider: deepseek
    api_path: "/deepseek/v1"
    api_name: deepseek-v4-pro
    price_in: 0.726
    price_out: 2.178
    context_window: null
    vision: false
    is_anchor: false
    role: pilot_option   # D-082: compared with claude-sonnet-5-5 in the pilot; not a candidate yet
    verified: false
  - id: jev
    provider: typesafe
    api_name: jev-latest
    api_path: "/typesafe/v1/systemone"   # full route, not chat format: metis.judge.jev only
    price_in: 0.0462
    price_out: 0
    context_window: null
    vision: false
    is_anchor: false
    role: judge_option   # owner: "may use"; compare with the judge in the pilot if confirmed
    verified: false

