# Candidate models + judge (WP-02). Prices: USD per 1M tokens, Metis AI prices (WP-04 step 10).
# deepseek-v4-flash costs double in peak hours: Mon-Fri 01:00-04:00 and 06:00-10:00 UTC.
# context_window / vision: public model specs, `verified: false` until WP-04 checks them.
price_date: "2026-11-01"
price_source: "https://api.metisai.ir/api/v1/meta/providers/pricing"
# api_path: appended to METIS_BASE_URL; Metis AI has one route per provider (docs.metisai.ir).
reserve_output_tokens: 1024   # gen max_tokens (D-036); a model fits if tokens_in + this <= window
models:
  - id: deepseek-v4-flash
    provider: deepseek
    api_path: "/deepseek/v1"
    api_name: deepseek-v4-flash
    price_in: 0.165
    price_out: 0.66
    price_cached: 0.0033
    context_window: 128000
    vision: false
    is_anchor: false
    role: candidate
    verified: false
  - id: gpt-5.6-luna
    provider: openai
    api_path: "/openai/v1"
    api_name: gpt-5.6-luna
    price_in: 0.22
    price_out: 1.32
    price_cached: 0.022
    context_window: 128000
    vision: true
    is_anchor: false
    role: candidate
    verified: false
  - id: gemini-2.5-flash-lite
    provider: google
    api_path: "/api/v1/wrapper/google"
    api_name: gemini-2.5-flash-lite
    price_in: 0.11
    price_out: 0.44
    context_window: 1048576
    vision: true
    is_anchor: false
    role: candidate
    exp_role: holdout   # hidden in the holdout demo (M4)
    verified: false
  - id: claude-sonnet-5-5
    provider: anthropic
    api_path: "/api/v1/wrapper/anthropic"
