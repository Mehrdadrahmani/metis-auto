# S1/S2 settings (WP-02). Sizes from PLAN (val 400 / test 300 / pilot 100 / cal 100).
seed: 20261020
s1:
  huge_prompt_chars: 20000          # M7: excluded from labeled sets
  min_text_chars: 2
  history_max_turns: 10             # generation context: last 10 messages ...
  history_max_tokens: 6000          # ... and at most this many estimated tokens
  chars_per_token: 3                # rough estimate until the embedder/LLM tokenizers are known
  embed_truncate: false             # D-047: the whole message is embedded
s2:
  n_val: 400
  n_test: 300
  n_pilot: 100                      # subset of val
  recent_pool_factor: 3             # recent pool holds ~3x the needed labeled prompts
  max_per_session: 3                # eligible prompts per session in val/test
  cal_models: [deepseek-v4-flash, gpt-5.6-luna, gemini-3.5-flash-lite]   # round-robin, non-anchor
sample_dry_run:                     # step 8: scaled sizes for the 100-session sample
  n_val: 60
  n_test: 40
  n_pilot: 20
router:                             # S5, S8-S10 (WP-05); paper settings, PLAN M13, M14
  kmeans_n_init: 10
  alpha_point: 0                    # Eq. 12; 2 only as a robustness check (D-054)
  alpha_pair: 2                     # virtual ties, spec S8-PW
  select_k_repeats: 20              # DEV-6
  lambda_n: 60
  lambda_low: 0.001
  lambda_high: 100.0
s4:                                 # embedder (WP-03, D-048, D-052): choice between candidates in WP-08
  choice: pending                   # small | nano; decided in WP-08 on real data (owner, D-052)
  candidates:
    small:
      name: jinaai/jina-embeddings-v5-text-small
      revision: dd76d535f5447ca3897a9c893fb1e612ead98192
      path: models/jina_v5_text_small_dd76d535f544
    nano:
      name: jinaai/jina-embeddings-v5-text-nano
      revision: 8a7f00aac812071b69403df470f1038ec85f8925
      path: models/jina_v5_text_nano_8a7f00aac812
  task: clustering                  # routing (S4/S5, G2); same embedder offline and online
  cache_task: text-matching         # semantic cache (WP-17): better paraphrase separation (AUC)
  prompt_name: document             # D-049
  merge_adapter: true               # same vectors, ~2x faster (results/wp03_embedder/embedder_benchmark.md)
  device: mps                       # cpu gives identical vectors (max diff 3.5e-7)
  dtype: float32                    # fp16 gains little
  batch_size: 16
  max_batch_tokens: 8192
  max_tokens: 32768                 # whole message (D-047); sample max 2,562 tokens
