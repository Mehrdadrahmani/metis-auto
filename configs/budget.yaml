# Budget guard (WP-04, PLAN E12, AGENTS.md §5). USD.
# Every stage stays at 0 until the owner says "go" for that stage.
hard_cap_usd: 60
approved_usd:
  pilot: 10            # Gate 1, D-094; other stages wait for Gate 2
  gen_main: 21.5       # owner "go" 2026-11-03 (D-115): Sonnet measured $0.0204 per call on new prompts, run about $9.20
  judge_main: 3        # owner "go pairwise" 2026-11-03 (D-116): pairwise on val 800, estimate $1.15 to $1.50
  cache_labels: 1      # owner consent D-119
  live: 1.5            # owner consent D-119
# Automatic stops in run_batch (AGENTS.md §5).
anomalies:
  min_calls: 20            # rate checks start after this many new calls
  max_failure_rate: 0.05
  max_cost_ratio: 2.0      # running cost per call / estimate
  max_truncation_rate: 0.10
  max_reasoning_share: 0.10  # reasoning tokens / output tokens
